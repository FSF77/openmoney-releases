<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OpenMoney</title>

  <!-- PWA & Apple Mobile Web App Settings -->
  <meta name="theme-color" content="#0a0e17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OpenMoney">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="manifest" href="manifest.json">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Application Root -->
  <div id="app"></div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- MODAL: Alternar Base de Dados -->
  <div id="modalDbSwitcher" class="modal-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Bases de Dados</div>
        <button class="sheet-close">&times;</button>
      </div>

      <div id="dbListContainer" style="margin-bottom: 20px;"></div>

      <button id="btnAddNewDb" class="btn-submit" style="background: rgba(255, 255, 255, 0.08); box-shadow: none; border: 1px dashed var(--border-glass);">
        + Importar Outra Base do iCloud (.json)
      </button>
      <input type="file" id="fileInputSwitcher" accept=".json" style="display:none;">
    </div>
  </div>

  <!-- MODAL: Detalhes da Conta (Extrato Recente) -->
  <div id="modalAccountDetails" class="modal-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div>
          <div id="accountDetailsTitle" class="sheet-title">Conta</div>
          <div id="accountDetailsSubtitle" style="font-size:0.8rem;color:var(--text-muted);margin-top:2px;"></div>
        </div>
        <button class="sheet-close">&times;</button>
      </div>

      <!-- Filtro de Período -->
      <div class="filter-tabs">
        <button id="btnAccountTabMonth" class="filter-tab active">Mês Atual</button>
        <button id="btnAccountTabAll" class="filter-tab">Todos os Lançamentos</button>
      </div>

      <div id="accountTxSummary" class="account-recent-banner" style="display:none;"></div>
      <div id="accountTxList" style="overflow-y: auto; max-height: 52vh; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;"></div>
    </div>
  </div>

  <!-- MODAL: Incluir Novo Lançamento -->
  <div id="modalNewTx" class="modal-overlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Novo Lançamento</div>
        <button class="sheet-close">&times;</button>
      </div>

      <!-- Segmented Control: Despesa / Receita / Transferência -->
      <div class="segmented-control">
        <button class="segmented-btn active despesa" data-type="despesa">Despesa</button>
        <button class="segmented-btn" data-type="receita">Receita</button>
        <button class="segmented-btn" data-type="transferencia">Transferência</button>
      </div>

      <!-- Valor -->
      <div class="form-group">
        <label class="form-label">Valor (R$)</label>
        <div class="amount-input-wrapper">
          <input type="text" id="txAmount" class="form-input amount-input" placeholder="0,00" inputmode="decimal">
        </div>
      </div>

      <!-- Sugestões de Favorecidos Frequentes (Chips) -->
      <div id="payeeChipsContainer" class="chips-scroll"></div>

      <!-- Favorecido / Descrição com Autocomplete -->
      <div class="form-group" id="txPayeeGroup">
        <label class="form-label">Favorecido / Estabelecimento</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="txPayee" class="form-input" placeholder="Ex: Supermercado, Salário, Restaurante" autocomplete="off" autocapitalize="words">
          <div id="payeeDropdown" class="autocomplete-dropdown"></div>
        </div>
      </div>

      <!-- Conta de Origem -->
      <div class="form-group">
        <label class="form-label" id="txAccLabel">Conta</label>
        <select id="txAccSelect" class="form-select"></select>
      </div>

      <!-- Conta de Destino (Apenas Transferência) -->
      <div class="form-group" id="txPeerGroup" style="display:none;">
        <label class="form-label">Conta Destino</label>
        <select id="txPeerSelect" class="form-select"></select>
      </div>

      <!-- Categoria -->
      <div class="form-group" id="txCatGroup">
        <label class="form-label">Categoria</label>
        <select id="txCatSelect" class="form-select"></select>
      </div>

      <!-- Data -->
      <div class="form-group">
        <label class="form-label">Data</label>
        <input type="date" id="txDate" class="form-input">
      </div>

      <!-- Status de Conciliação -->
      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);padding:10px 14px;border-radius:var(--radius-md);border:1px solid var(--border-glass);">
        <div>
          <label class="form-label" style="margin-bottom:2px;cursor:pointer;" for="txRecCheckbox">Conciliado (Efetivado)</label>
          <div style="font-size:0.75rem;color:var(--text-muted);">Debita imediatamente do Saldo Real</div>
        </div>
        <input type="checkbox" id="txRecCheckbox" checked style="width:20px;height:20px;accent-color:var(--om-green);cursor:pointer;">
      </div>

      <!-- Modalidade: Único ou Parcelado -->
      <div class="form-group">
        <label class="form-label">Modalidade</label>
        <select id="txMode" class="form-select">
          <option value="single">Lançamento Único</option>
          <option value="installment">Parcelado</option>
        </select>
      </div>

      <!-- Parcelas (se Parcelado) -->
      <div class="form-group" id="txInstallmentsGroup" style="display:none;">
        <label class="form-label">Quantidade de Parcelas</label>
        <input type="number" id="txInstallments" class="form-input" min="2" max="120" value="2">
      </div>

      <!-- Observação / Nota -->
      <div class="form-group">
        <label class="form-label">Nota / Memorando (Opcional)</label>
        <input type="text" id="txMemo" class="form-input" placeholder="Anotação ou tag de previsão">
      </div>

      <button id="btnSaveTx" class="btn-submit">Salvar Lançamento</button>
    </div>
  </div>

  <!-- Main JavaScript App -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
